name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (mvn verify + spotless + jacoco)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout (with common/jwt-support submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Maven verify (spotless:check + tests + jacoco)
        run: mvn -B -ntp -DskipITs -s services/.m2-settings.xml verify
        working-directory: services
